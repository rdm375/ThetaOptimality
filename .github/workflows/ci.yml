name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  make-tests:
    name: GCC / Make validation suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes g++ make python3
      - name: Build and run the C++ validation and experiment suite
        run: make test
      - name: Check plotting-script syntax
        run: python3 -m compileall -q tools

  cmake-tests:
    name: CMake build and CTest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-cmake --parallel 2
      - name: Run tests
        run: ctest --test-dir build-cmake --output-on-failure
